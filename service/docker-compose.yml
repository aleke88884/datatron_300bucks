services:
  api:
    build: .
    image: fortebank-cashdesk:cpu
    container_name: fortebank-cashdesk
    init: true            # PID 1 подбирает зомби-процессы убитых воркеров
    env_file:
      - path: .env
        required: false   # без .env сервис не стартует с понятной ошибкой «API_KEY не задан», а не падением compose
    environment:
      DATA_DIR: /app/data
    ports:
      - "8000:8000"
    volumes:
      - cashdesk-data:/app/data
    restart: unless-stopped
    # Ограничение ресурсов при необходимости:
    # deploy:
    #   resources:
    #     limits: { cpus: "4", memory: 8g }

volumes:
  cashdesk-data:
