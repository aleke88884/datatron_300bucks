# GPU-вариант. Запуск из папки service/:
#   python3 deploy/gen_api_key.py                      # API_KEY → service/.env
#   python3 scripts/get_models.py                      # веса YOLOX → service/models/ (или DOWNLOAD_MODELS=1)
#   python3 scripts/get_vlm.py                         # (опционально) веса Qwen2.5-VL-7B → service/models/vlm, ~16 ГБ
#   WITH_VLM=1 docker compose -f deploy/docker-compose.gpu.yml up --build -d   # или без WITH_VLM
# VLM включается в service/.env: VLM_ENABLED=1 (VLM_4BIT=1 для GPU с 8–12 ГБ). Детектор идёт на GPU через ORT_PROVIDERS.
# Требуется NVIDIA Container Toolkit на хосте (docker run --gpus all должен работать).
# Переменные берутся из service/.env (API_KEY обязательна; см. .env.example).

name: fortebank-cashdesk-gpu

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.gpu
      args:
        WITH_VLM: "${WITH_VLM:-0}"
        DOWNLOAD_MODELS: "${DOWNLOAD_MODELS:-0}"
    image: fortebank-cashdesk:gpu
    container_name: fortebank-cashdesk-gpu
    env_file: ../.env
    environment:
      DATA_DIR: /app/data
      MODELS_DIR: /app/models
      ORT_PROVIDERS: CUDAExecutionProvider,CPUExecutionProvider
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - ../models:/app/models        # веса: yolox_m.onnx и (при VLM_ENABLED=1) models/vlm — на хосте service/models
      - cashdesk-data:/app/data      # временные загрузки (удаляются после анализа)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    shm_size: "2g"
    restart: unless-stopped

volumes:
  cashdesk-data:
